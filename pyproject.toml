[project]
name = "kimi-s-app-dev-test"
version = "0.1.0"
description = "InvoiceCraft — professional invoicing micro-SaaS (FastAPI + Stripe)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "ruff>=0.16.8",
    "scipy>=1.18.1",
    "sqlmodel>=0.0.42",
    "stripe>=15.6.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
