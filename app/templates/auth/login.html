{% extends "base.html" %}
{% block title %}Log in — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-wrap fade-up">
  <a class="auth-brand" href="/">
    <svg class="brand-mark" width="26" height="26" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <rect width="64" height="64" rx="14" fill="#4f46e5"/>
      <path d="M35 10 20 36h10l-3 18 16-26H33l2-18z" fill="#fff"/>
    </svg>
    {{ app_name }}
  </a>
  <div class="auth-box card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your invoices.</p>
    {% if error %}<p class="alert-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>Email
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <p class="muted auth-alt">No account yet? <a href="/signup">Sign up</a></p>
  </div>
</div>
{% endblock %}
