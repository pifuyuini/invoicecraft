{% if error %}<p class="alert-error">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}">
  <div class="form-row">
    <label>Client
      <select name="client_id">
        <option value="">— No client —</option>
        {% for client in clients %}
        <option value="{{ client.id }}" {% if invoice and invoice.client_id == client.id %}selected{% endif %}>{{ client.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Currency
      <select name="currency">
        {% for c in currencies %}
        <option value="{{ c }}" {% if (invoice and invoice.currency == c) or (not invoice and c == "USD") %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="form-row">
    <label>Issue date
      <input type="date" name="issue_date" value="{{ invoice.issue_date if invoice else today }}">
    </label>
    <label>Due date
      <input type="date" name="due_date" value="{{ invoice.due_date if invoice and invoice.due_date else '' }}">
    </label>
  </div>
  <div class="form-row">
    <label>Tax rate (%)
      <input type="number" name="tax_rate" step="0.01" min="0" value="{{ '%g' % invoice.tax_rate if invoice else 0 }}">
    </label>
  </div>

  <h3>Line items</h3>
  <table class="table">
    <thead>
      <tr>
        <th>Description</th>
        <th>Quantity</th>
        <th>Unit price</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="items-body">
      {% if items %}
        {% for item in items %}
        <tr>
          <td><input type="text" name="description" value="{{ item.description }}"></td>
          <td><input type="number" name="quantity" step="any" min="0" value="{{ '%g' % item.quantity }}"></td>
          <td><input type="number" name="unit_price" step="0.01" min="0" value="{{ '%g' % item.unit_price }}"></td>
          <td><button type="button" class="btn btn-ghost btn-sm remove-row">Remove</button></td>
        </tr>
        {% endfor %}
      {% else %}
        <tr>
          <td><input type="text" name="description" value=""></td>
          <td><input type="number" name="quantity" step="any" min="0" value="1"></td>
          <td><input type="number" name="unit_price" step="0.01" min="0" value="0"></td>
          <td><button type="button" class="btn btn-ghost btn-sm remove-row">Remove</button></td>
        </tr>
      {% endif %}
    </tbody>
  </table>
  <p><button type="button" class="btn btn-ghost btn-sm" id="add-item">Add item</button></p>

  <label>Notes
    <textarea name="notes">{{ invoice.notes if invoice else '' }}</textarea>
  </label>

  <div class="actions">
    <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
    <a href="{{ cancel_url }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>

<script>
(function () {
  var tbody = document.getElementById('items-body');
  document.getElementById('add-item').addEventListener('click', function () {
    var row = tbody.rows[0].cloneNode(true);
    row.querySelectorAll('input').forEach(function (input) {
      input.value = input.name === 'quantity' ? '1' : '';
    });
    tbody.appendChild(row);
  });
  tbody.addEventListener('click', function (e) {
    if (!e.target.classList.contains('remove-row')) return;
    if (tbody.rows.length > 1) {
      e.target.closest('tr').remove();
    } else {
      e.target.closest('tr').querySelectorAll('input').forEach(function (input) { input.value = ''; });
    }
  });
})();
</script>
