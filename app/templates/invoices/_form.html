{% if error %}<p class="alert-error">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}" id="invoice-form">
  <div class="invoice-form-grid">
    <div class="card">
      <div class="form-row">
        <label>Client
          <select name="client_id">
            <option value="">— No client —</option>
            {% for client in clients %}
            <option value="{{ client.id }}" {% if invoice and invoice.client_id == client.id %}selected{% endif %}>{{ client.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Currency
          <select name="currency" id="currency-select">
            {% for c in currencies %}
            <option value="{{ c }}" {% if (invoice and invoice.currency == c) or (not invoice and c == "USD") %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="form-row">
        <label>Issue date
          <input type="date" name="issue_date" value="{{ invoice.issue_date if invoice else today }}">
        </label>
        <label>Due date
          <input type="date" name="due_date" value="{{ invoice.due_date if invoice and invoice.due_date else '' }}">
        </label>
      </div>
      <div class="form-row">
        <label>Tax rate (%)
          <input type="number" name="tax_rate" step="0.01" min="0" value="{{ '%g' % invoice.tax_rate if invoice else 0 }}">
        </label>
      </div>

      <h3>Line items</h3>
      <table class="table">
        <thead>
          <tr>
            <th>Description</th>
            <th>Quantity</th>
            <th>Unit price</th>
            <th>Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items-body">
          {% if items %}
            {% for item in items %}
            <tr>
              <td><input type="text" name="description" value="{{ item.description }}"></td>
              <td><input type="number" name="quantity" step="any" min="0" value="{{ '%g' % item.quantity }}"></td>
              <td><input type="number" name="unit_price" step="0.01" min="0" value="{{ '%g' % item.unit_price }}"></td>
              <td class="row-amount">—</td>
              <td><button type="button" class="btn btn-ghost btn-sm remove-row">Remove</button></td>
            </tr>
            {% endfor %}
          {% else %}
            <tr>
              <td><input type="text" name="description" value=""></td>
              <td><input type="number" name="quantity" step="any" min="0" value="1"></td>
              <td><input type="number" name="unit_price" step="0.01" min="0" value="0"></td>
              <td class="row-amount">—</td>
              <td><button type="button" class="btn btn-ghost btn-sm remove-row">Remove</button></td>
            </tr>
          {% endif %}
        </tbody>
      </table>
      <p><button type="button" class="btn btn-ghost btn-sm" id="add-item">Add item</button></p>

      <label>Notes
        <textarea name="notes">{{ invoice.notes if invoice else '' }}</textarea>
      </label>
    </div>

    <div class="invoice-summary-col">
      <div class="card invoice-summary">
        <h3>Summary</h3>
        <div class="summary-row">
          <span class="muted">Subtotal</span>
          <span id="sum-subtotal">—</span>
        </div>
        <div class="summary-row">
          <span class="muted">Tax (<span id="sum-tax-rate">0</span>%)</span>
          <span id="sum-tax">—</span>
        </div>
        <div class="summary-row summary-total">
          <strong>Total</strong>
          <strong id="sum-total">—</strong>
        </div>
        <div class="actions summary-actions">
          <button type="submit" class="btn btn-primary btn-block">{{ submit_label }}</button>
          <a href="{{ cancel_url }}" class="btn btn-ghost btn-block">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</form>

<script>
(function () {
  var SYMBOLS = {{ {"USD": "$", "EUR": "€", "GBP": "£", "CNY": "¥", "JPY": "¥"} | tojson }};
  var form = document.getElementById('invoice-form');
  var tbody = document.getElementById('items-body');
  var currencySelect = document.getElementById('currency-select');
  var taxInput = form.querySelector('input[name="tax_rate"]');

  function symbol() {
    return SYMBOLS[currencySelect.value] || (currencySelect.value + ' ');
  }
  function num(value) {
    var n = parseFloat(value);
    return isNaN(n) ? 0 : n;
  }
  function fmt(value) {
    return symbol() + value.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function recalc() {
    var subtotal = 0;
    tbody.querySelectorAll('tr').forEach(function (row) {
      var q = num(row.querySelector('input[name="quantity"]').value);
      var p = num(row.querySelector('input[name="unit_price"]').value);
      var amount = q * p;
      subtotal += amount;
      row.querySelector('.row-amount').textContent = fmt(amount);
    });
    var rate = num(taxInput.value);
    var tax = subtotal * rate / 100;
    document.getElementById('sum-subtotal').textContent = fmt(subtotal);
    document.getElementById('sum-tax-rate').textContent = String(rate);
    document.getElementById('sum-tax').textContent = fmt(tax);
    document.getElementById('sum-total').textContent = fmt(subtotal + tax);
  }

  document.getElementById('add-item').addEventListener('click', function () {
    var row = tbody.rows[0].cloneNode(true);
    row.querySelectorAll('input').forEach(function (input) {
      input.value = input.name === 'quantity' ? '1' : '';
    });
    tbody.appendChild(row);
    recalc();
  });
  tbody.addEventListener('click', function (e) {
    if (!e.target.classList.contains('remove-row')) return;
    if (tbody.rows.length > 1) {
      e.target.closest('tr').remove();
    } else {
      e.target.closest('tr').querySelectorAll('input').forEach(function (input) { input.value = ''; });
    }
    recalc();
  });
  form.addEventListener('input', recalc);
  currencySelect.addEventListener('change', recalc);
  recalc();
})();
</script>
